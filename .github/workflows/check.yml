name: Skin CI and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Files and tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
  browser:
    name: Chromium regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_REPORT_DIR: artifacts/browser
      - name: Save browser report and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: browser-report-${{ github.sha }}
          path: artifacts/browser/
          if-no-files-found: warn
          retention-days: 14
  package:
    name: Verified installation candidate
    needs: [check, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm run package:skin
      - name: Save install ZIP and checksums
        uses: actions/upload-artifact@v5
        with:
          name: whale-desk-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
